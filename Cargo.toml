[package]
name = "profile"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5.37", features = ["derive"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[lib]
name = "profile"
crate-type = ["staticlib"]

[profile.dev]
panic = 'abort'

[profile.release]
panic = 'abort'
